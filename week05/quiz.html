<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main class="box">
        <!-- Fixed: Changed <hi> to <h1> -->
        <h1>Basic HTML and CSS Quiz</h1>
        <form class="box">

            <!-- Fixed: Corrected "calss" to "class" -->
            <div class="quiz-item" box>
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <!-- Fixed: Corrected class spelling and changed name to q2 -->
            <div class="class-item" box>
                <label for="q2">2. How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>

            <!-- Fixed: Stripped out duplicate nested select and label elements -->
            <div class="quiz-item box">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose one...</option>
                    <option value="a">A. &lt;!-- This is a comment --&gt;</option>
                    <option value="b">B. /* this is a comment */</option>
                    <option value="c">C. // This is a comment</option>
                </select>
            </div>

            <!-- Fixed: Restored <div> element wrapper and fixed quote mismatch on name -->
            <div class="quiz-item box">
                <label for="q4">4. What is the bottom margin given this declaration?</label>
                <code class="box">margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>

            <button type="submit">Submit Quiz for Grading</button>
        </form>
    </main>
</body>

</html>
