<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Layout</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>


    <header>
        <h1>WDD130 | HTML Form - User poll</h1>

    </header>


    <main>
        <h2>Contact information</h2>

    </main>

    <form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="useremail">Email:</label>
        <input type="email" id="useremail" name="useremail" required>

        <!-- Keep all the other form controls here -->

        <button type="submit">Submit Poll</button>
    </form>

    <label for="quantity">Select Quantity</label>
    <select name="quantity" id="quantity">
        <option value="1">One</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
    </select>
    <h2>Check Your Understanding</h2>
    <label for="browser">What is your favorite internet browser?</label>
    <select id="browser" name="browser">
        <option value="chrome">Chrome</option>
        <option value="firefox">Firefox</option>
        <option value="edge">Edge</option>
        <option value="brave">Brave</option>
        <option value="other">Other</option>
    </select>
    <label for="pet">Do you have a household pet?</label>
    <input type="checkbox" id="pet" name="pet">
    <label for="feedback">List the places you have lived:</label>
    <textarea id="feedback" name="feedback" rows="4"
      placeholder="Fujian China, Quincy Massachusetts, Des Moines Iowa">
    </textarea>
    <div class="form-item">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
    </div>
    <div class="form-item column2">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
    </div>
    <div class="form-item column2">
        <label for="useremail">Email:</label>
        <input type="email" id="useremail" name="useremail">
    </div>
    <button type="submit">Submit Poll</button>
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>
</body>

</html>
